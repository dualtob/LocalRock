name: Web App Release

# Builds the production Web App bundle and publishes it twice (ADR 0002):
# - as the container image `ghcr.io/dualtob/localrock-web`, tagged with the version without
#   `web-v` and with `latest` (see web-image/);
# - as `localrock-web.zip` on a GitHub Release, for hosting the files anywhere else.
# Triggered by pushing a Web App tag, e.g. `git tag web-v1.0.0 && git push origin web-v1.0.0`.
# Web App tags (`web-v*`) are separate from App releases, which this workflow ignores.
#
# The release asset is always named `localrock-web.zip`, so it can be fetched from
#   https://github.com/dualtob/LocalRock/releases/download/<tag>/localrock-web.zip
# Web App releases are never marked "Latest" (that stays with App releases), so
# `.../releases/latest/download/...` must not be used to find them.
# The zip holds the static files with `index.html` at its root; whoever hosts it adds a
# `config.json` next to it that names the Server.
#
# Nothing is published until the zip and the image pass their checks. The release is then
# created as a draft, the image pushed, and the draft published last: a failed push leaves
# only an unpublished draft, never an image without its release (re-running after a failed
# push needs the draft deleted first).

on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: web-app-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ASSET: localrock-web.zip
  IMAGE: ghcr.io/dualtob/localrock-web

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # The Android Gradle plugin needs an SDK to configure the project, even for wasm tasks.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build production wasm bundle
        run: ./gradlew --no-daemon :composeApp:wasmJsBrowserDistribution

      - name: Zip static files
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          zip -r -X "$GITHUB_WORKSPACE/$ASSET" .

      # "Add to Home Screen" needs the manifest and icons at the root, linked from the page.
      - name: Check zip layout
        run: |
          list=$(unzip -Z1 "$ASSET")
          echo "$list"
          for f in index.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png favicon-32.png favicon-16.png favicon.ico apple-touch-icon-precomposed.png; do
            echo "$list" | grep -qxF "$f" || { echo "::error::$f is not at the zip root"; exit 1; }
          done
          page=$(unzip -p "$ASSET" index.html)
          for link in 'rel="manifest" href="manifest.webmanifest"' 'rel="apple-touch-icon" href="apple-touch-icon.png"' 'rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"'; do
            grep -qF "$link" <<<"$page" || { echo "::error::index.html lacks <link $link>"; exit 1; }
          done
          icons=$(unzip -p "$ASSET" manifest.webmanifest | jq -er '.icons[].src') || { echo "::error::manifest.webmanifest is not valid JSON with icons"; exit 1; }
          for src in $icons; do
            echo "$list" | grep -qxF "$src" || { echo "::error::manifest icon $src is not at the zip root"; exit 1; }
          done

      - name: Build image
        run: |
          docker build -f web-image/Dockerfile \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#web-v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t localrock-web:check .

      # Serves the Web App and names the Server given in SERVER_URL, and names none without it.
      - name: Check image
        run: web-image/check-image.sh localrock-web:check

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Web App $GITHUB_REF_NAME" \
            --generate-notes \
            --latest=false \
            --draft

      - name: Push image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#web-v}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$version" latest; do
            docker tag localrock-web:check "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
