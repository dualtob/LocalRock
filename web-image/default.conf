# Plain HTTP on 8080; TLS belongs to the reverse proxy in front (ADR 0002).
# IPv4 only: listening on [::] stops nginx from starting where IPv6 is disabled (e.g. Proxmox LXCs).
# Stock mime.types already serves .wasm as application/wasm, which streaming compilation needs.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The two .wasm files are about 17 MB as built and 5.6 MB gzipped. The image ships each file
    # gzipped next to the original (see Dockerfile), served as is to any browser that takes gzip.
    gzip_static on;
    gzip on;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css;
    gzip_vary on;

    # Revalidated on every launch (a cheap 304 when unchanged), so a new release is picked up at once.
    add_header Cache-Control "no-cache";

    # The .wasm files are named by their content hash: a new build has new names, so a browser may
    # keep these for good instead of fetching 5.6 MB again on every cold start.
    location ~ "^/[0-9a-f]{20}\.wasm$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A types block replaces the inherited map, so it stays scoped to this one file type.
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
    }

    # The Web App fetches config.json at startup; a changed SERVER_URL must show up at once.
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
