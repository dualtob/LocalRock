#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
# -Xss64m avoids a StackOverflowError in Gradle's btree cache (FreeListBlockStore.alloc) seen on
# this machine, and keeps CLI + Android Studio on one shared daemon (fewer journal-lock conflicts).
org.gradle.jvmargs=-Xmx4096M -Xss64m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 (needed by Compose Multiplatform 1.12) no longer allows com.android.application in a
# Kotlin Multiplatform module. These keep the single-module setup until composeApp is split.
android.builtInKotlin=false
android.newDsl=false
